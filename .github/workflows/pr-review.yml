name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: pr-review-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run automated PR review
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ vars.PR_REVIEW_MODEL || 'gpt-4o-mini' }}
          strictness: ${{ vars.PR_REVIEW_STRICTNESS || 'standard' }}
